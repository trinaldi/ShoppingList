name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "KEYSTORE_BASE64 não definido"
            exit 1
          }

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

          test -s "$RUNNER_TEMP/release.jks" || {
            echo "Keystore inválido ou vazio"
            exit 1
          }

          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          OUT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$OUT"
          echo "$OUT" | grep -qi "f965f66ff7e6917f417523da56c7063876d845eb82364fa9be1036eaa95fa8cb" \
            || { echo "Certificado diferente do esperado"; exit 1; }

      - name: Rename APK file
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/ListaDeCompras.apk

      - name: Release and Upload APK
        uses: softprops/action-gh-release@v3
        with:
          files: build-output/ListaDeCompras.apk
          name: "Lista de Compras Release ${{ github.ref_name }}"
          body: "Baixe o aplicativo atualizado diretamente no arquivo ListaDeCompras.apk abaixo."
          draft: false
          prerelease: false
