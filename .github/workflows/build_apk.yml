name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Dispara sempre que você criar uma tag como v1.0.0

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permite que a Action crie a release e publique arquivos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK file
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/ListaDeCompras.apk

      - name: Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/ListaDeCompras.apk
          name: "Shopping List Release ${{ github.ref_name }}"
          body: "Baixe o aplicativo atualizado diretamente no arquivo ListaDeCompras.apk abaixo."
          draft: false
          prerelease: false
